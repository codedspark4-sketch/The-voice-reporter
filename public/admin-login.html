<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — THE VOICE REPORTER</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0b1220,#182233);font-family:system-ui;color:#fff}.card{width:min(420px,calc(100% - 32px));background:#fff;color:#111827;border-radius:24px;padding:30px;box-shadow:0 20px 70px #0007}.mark{width:52px;height:52px;border-radius:14px;background:#be1212;color:#fff;display:grid;place-items:center;font-weight:900;font-size:26px}.k{color:#be1212;font-weight:900;letter-spacing:.12em;font-size:11px}.card h1{margin:8px 0}.field{display:grid;gap:7px;margin:15px 0}.field input{padding:13px;border:1px solid #d0d5dd;border-radius:11px;font:inherit}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#be1212;color:#fff;font-weight:900;cursor:pointer}.err{color:#b42318;margin-top:10px;min-height:20px}.back{display:block;margin-top:18px;color:#667085;text-align:center}</style></head><body><form class="card" id="form"><div class="mark">V</div><div class="k">PRIVATE CONTROL CENTER</div><h1>Administrator Login</h1><p>THE VOICE REPORTER</p><div class="field"><label>Username</label><input id="username" value="admin" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn">Enter Admin Center</button><div id="err" class="err"></div><a class="back" href="/">← Return to public newsroom</a></form><script>form.onsubmit=async e=>{e.preventDefault();err.textContent='';try{const r=await fetch('/api/auth/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!d.ok)throw new Error(d.error);location.href='/admin/dashboard'}catch(x){err.textContent=x.message||'Login failed'}};</script></body></html>
