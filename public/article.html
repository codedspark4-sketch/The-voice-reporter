<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE VOICE REPORTER — Article</title><style>:root{font-family:Inter,system-ui,sans-serif;--bg:#f4f6fa;--surface:#fff;--text:#101828;--muted:#667085;--red:#be1212;--border:#e4e7ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}a{text-decoration:none;color:inherit}.top{background:#0f172a;color:#fff;padding:16px 22px;position:sticky;top:0;z-index:5}.top-inner{max-width:1080px;margin:auto;display:flex;justify-content:space-between;align-items:center}.top a{font-weight:900;letter-spacing:.05em}.wrap{max-width:1000px;margin:auto;padding:22px 16px 70px}.reader{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:clamp(22px,4vw,48px);box-shadow:0 12px 35px rgba(16,24,40,.08)}.back{display:inline-block;margin-bottom:18px;font-weight:800}.meta{color:var(--muted);font-size:13px}.title{font:900 clamp(34px,6vw,68px)/1.02 Georgia,serif;margin:12px 0 15px}.deck{font-size:19px;color:var(--muted);max-width:800px}.article-actions,.story-nav{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:800}.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.article-body{font:19px/1.8 Georgia,serif}.article-body img{max-width:100%;height:auto;border-radius:15px}.source{margin-top:34px;padding-top:18px;border-top:1px solid var(--border);font:14px/1.5 system-ui;color:var(--muted)}.source a{color:#0b57d0}.ai-panel{margin-top:24px;background:#0f172a;color:#f8fafc;border-radius:18px;padding:20px}.ai-panel textarea{width:100%;min-height:100px;background:#111827;border:1px solid #334155;border-radius:12px;color:#fff;padding:12px}.ai-result{white-space:pre-wrap;margin-top:14px}.nav-label{color:var(--muted);font-size:13px}.error{padding:18px;background:#fff0f0;color:#8a1c1c;border-radius:12px}</style></head><body><header class="top"><div class="top-inner"><a href="/">THE VOICE REPORTER</a><a href="/#latest">Back to news</a></div></header><main class="wrap"><article class="reader"><div id="root">Reading the report…</div></article></main><script>
(()=>{const root=document.getElementById('root');const p=new URLSearchParams(location.search);const id=p.get('id');const url=p.get('url');let all=[],currentIndex=-1,currentStory=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function safe(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:'#'}catch(_){return '#'}}function pageFor(x){return x.editorial?`/article?id=${encodeURIComponent(x.id)}`:`/article?url=${encodeURIComponent(x.link||'')}`}function renderError(m){root.innerHTML=`<div class="error">${esc(m)}</div>`}function listen(text){if(!('speechSynthesis'in window)){alert('Text-to-speech is not supported in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1;u.pitch=1;u.volume=1;const voices=speechSynthesis.getVoices();const preferred=voices.find(v=>/English|en-NG|en-GB|en-US/i.test(v.lang));if(preferred)u.voice=preferred;speechSynthesis.speak(u)}async function ai(question){const out=document.getElementById('aiResult');out.textContent='AI is working…';const context=currentStory?`${currentStory.title}\n${currentStory.description||''}`:'';try{const r=await fetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:'You are THE VOICE REPORTER article assistant. Be factual, concise and do not invent details. Use the supplied story as context.',messages:[{role:'user',content:`${question}\n\nSTORY CONTEXT:\n${context}`}]})});const d=await r.json();out.textContent=d.success?d.text:(d.error||'AI unavailable')}catch(e){out.textContent='AI unavailable right now.'}}
async function load(){try{const nr=await fetch('/api/news?limit=500',{cache:'no-store'});const nd=await nr.json();all=nd.items||[];if(id){const r=await fetch('/api/story/'+encodeURIComponent(id));const d=await r.json();if(!d.ok)throw new Error(d.error||'Story not found');currentStory=d.story;currentIndex=all.findIndex(x=>x.id===id);if(currentIndex<0){all=[currentStory,...all];currentIndex=0}}else{currentIndex=all.findIndex(x=>String(x.link||'')===String(url||''));currentStory=all[currentIndex]||null}if(currentStory&&currentStory.editorial){renderEditorial(currentStory)}else await renderPublisher(url)}catch(e){renderError(e.message||'Unable to load this story')}}async function renderPublisher(target){if(!target)return renderError('No article was selected.');root.innerHTML='<div class="meta">THE VOICE REPORTER</div><div class="title">Reading article…</div>';try{const r=await fetch('/api/article?url='+encodeURIComponent(target),{cache:'no-store'});const d=await r.json();if(!d.ok)throw new Error(d.error||'Unable to read article');const a=d.article;document.title=(a.title||'Article')+' — THE VOICE REPORTER';renderFrame({title:a.title,description:a.excerpt,byline:a.byline,siteName:a.siteName,content:a.content,url:a.url,publishedAt:a.publishedTime,editorial:false})}catch(e){renderError(e.message||'Unable to read publisher article')}}function nav(){const prev=all[currentIndex-1],next=all[currentIndex+1];return `<div class="story-nav"><span class="nav-label">${all.length?`${currentIndex+1} / ${all.length}`:''}</span>${prev?`<a class="btn" href="${pageFor(prev)}">← Previous</a>`:''}${next?`<a class="btn primary" href="${pageFor(next)}">Next →</a>`:''}</div>`}function renderEditorial(s){renderFrame({title:s.title,description:s.subheadline,byline:s.author,siteName:'THE VOICE REPORTER',content:s.body,sourceAttribution:s.sourceAttribution,url:'/',publishedAt:s.publishedAt,editorial:true})}function renderFrame(a){root.innerHTML=`<a class="back" href="/">← Back to news</a><div class="meta">${esc(a.siteName||'News')} · ${esc(a.publishedAt||'')}${a.editorial?' · ORIGINAL STORY':''}</div><h1 class="title">${esc(a.title)}</h1>${a.description?`<p class="deck">${esc(a.description)}</p>`:''}${a.byline?`<div class="meta">By ${esc(a.byline)}</div>`:''}<div class="article-actions"><button class="btn primary" id="listen">▶ Listen to story</button><button class="btn" id="stop">■ Stop</button></div><div class="article-body">${a.content||'<p>No article body available.</p>'}</div><div class="ai-panel"><strong>AI NEWS ASSISTANT</strong><textarea id="aiQuestion" placeholder="Ask anything about this story…"></textarea><div class="article-actions"><button class="btn primary" id="ask">Ask AI</button><button class="btn" id="brief">Quick brief</button><button class="btn" id="analysis">Deep analysis</button></div><div id="aiResult" class="ai-result"></div></div>${nav()}<div class="source">${a.editorial?'Original story published by THE VOICE REPORTER.':'Article supplied by '+esc(a.siteName||'the original publisher')+'.'} ${a.url&&a.url!=='/'?`<a href="${safe(a.url)}" target="_blank" rel="noopener noreferrer">View original article</a>`:''}</div>`;document.getElementById('listen').onclick=()=>listen((a.title||'')+' . '+(a.description||'')+' . '+root.querySelector('.article-body')?.innerText||'');document.getElementById('stop').onclick=()=>speechSynthesis?.cancel();document.getElementById('ask').onclick=()=>ai(document.getElementById('aiQuestion').value.trim()||'What are the most important facts in this story?');document.getElementById('brief').onclick=()=>ai('Give me a concise quick brief of this story: what happened, why it matters, and what is still uncertain.');document.getElementById('analysis').onclick=()=>ai('Give me a deep analysis of this story, separating verified facts from interpretation and explaining likely implications.');}load()})();
</script></body></html>
