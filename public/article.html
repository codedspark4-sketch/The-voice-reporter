<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>Article — THE VOICE REPORTER</title>
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--surface-2:#eef2f7;--text:#101828;--muted:#667085;
  --border:#e4e7ec;--accent:#b9151b;--gold:#b58a35;--ink:#0b1220;--good:#12805c;
  --shadow:0 18px 50px rgba(16,24,40,.08);--radius:22px;
}
body.dark{
  --bg:#070b12;--surface:#101722;--surface-2:#172130;--text:#f4f7fb;--muted:#99a5b3;
  --border:#293548;--accent:#ff5b61;--gold:#d9ad57;--ink:#f9fafb;--shadow:0 24px 70px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
a{color:inherit}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

.reader-header{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(18px);border-bottom:1px solid var(--border)
}
.header-inner{
  width:min(1240px,calc(100% - 32px));margin:auto;min-height:68px;
  display:flex;align-items:center;gap:12px
}
.back-btn,.icon-btn{
  width:42px;height:42px;border:1px solid var(--border);border-radius:12px;
  background:var(--surface-2);color:var(--text);display:grid;place-items:center
}
.reader-brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#0f172a,#334155);
  display:grid;place-items:center;color:white;font-weight:950
}
.reader-brand strong{display:block;font-size:14px;letter-spacing:.08em;white-space:nowrap}
.reader-brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.09em}
.header-spacer{flex:1}
.header-actions{display:flex;gap:7px}

.progress-wrap{position:fixed;top:0;left:0;right:0;height:3px;z-index:80;background:transparent}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold))}

.shell{width:min(1240px,calc(100% - 32px));margin:auto;padding:28px 0 80px}
.article-grid{display:grid;grid-template-columns:minmax(0,850px) 280px;gap:34px;align-items:start}
.article-card{
  overflow:hidden;background:var(--surface);border:1px solid var(--border);
  border-radius:28px;box-shadow:var(--shadow)
}
.hero{
  min-height:360px;background-size:cover;background-position:center;
  position:relative;display:flex;align-items:flex-end
}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.75))}
.hero-copy{position:relative;z-index:1;color:#fff;padding:30px}
.hero-copy .eyebrow{color:#f2d58e}
.eyebrow{font-size:10px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hero-copy h1{font:900 clamp(35px,6vw,68px)/.98 Georgia,serif;letter-spacing:-.03em;margin:8px 0 12px;max-width:800px}
.hero-copy .dek{font-size:17px;line-height:1.45;max-width:760px;color:rgba(255,255,255,.88)}
.fallback-hero{
  background:
    radial-gradient(circle at 78% 20%,rgba(217,173,87,.4),transparent 28%),
    linear-gradient(135deg,#101828,#253858 52%,#0b1220);
}
.article-info{padding:0 30px}
.info-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:18px 0;border-bottom:1px solid var(--border)
}
.byline{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.action-btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:11px;padding:9px 12px;font-weight:850
}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.action-btn.saved{background:var(--gold);border-color:var(--gold);color:#111}
.reader-content{padding:30px 42px 44px}
.article-content{
  font:20px/1.82 Georgia,"Times New Roman",serif;
  max-width:730px;margin:auto
}
.article-content>p:first-child:first-letter{float:left;font-size:4.5em;line-height:.8;padding:7px 9px 0 0;color:var(--accent)}
.article-content p,.article-content ul,.article-content ol,.article-content blockquote,.article-content figure{margin:0 0 20px}
.article-content h2,.article-content h3,.article-content h4{
  font-family:Inter,system-ui,sans-serif;line-height:1.15;margin:34px 0 14px
}
.article-content h2{font-size:28px}.article-content h3{font-size:23px}
.article-content a{color:#185adb;text-underline-offset:3px}
.article-content img{
  width:100%;height:auto;border-radius:17px;margin:22px 0 7px;display:block
}
.article-content figure{margin-left:0;margin-right:0}
.article-content figcaption{font:11px/1.5 Inter,system-ui,sans-serif;color:var(--muted)}
.article-content blockquote{
  margin:28px 0;padding:18px 22px;border-left:4px solid var(--accent);
  background:var(--surface-2);border-radius:0 14px 14px 0;font-style:italic
}
.article-content pre{
  white-space:pre-wrap;overflow:auto;background:#0b1220;color:#e5e7eb;border-radius:14px;padding:16px
}
.article-content table{width:100%;display:block;overflow:auto;border-collapse:collapse;font:14px/1.5 Inter,sans-serif}
.article-content th,.article-content td{border:1px solid var(--border);padding:8px}
.article-content iframe{
  width:100%;aspect-ratio:16/9;border:0;border-radius:16px;background:#000;margin:18px 0
}
.article-content video{width:100%;border-radius:16px;background:#000;margin:18px 0}
.article-content hr{border:0;border-top:1px solid var(--border);margin:34px 0}
.article-content .publisher-junk{display:none!important}

.reading-tools{
  width:min(730px,100%);margin:0 auto 28px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:15px
}
.tool-label{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.08em}
.tool-btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:9px;padding:7px 9px;font-weight:850;font-size:12px
}
.tool-spacer{flex:1}
.reading-size{font-weight:900;font-size:12px;color:var(--muted)}

.feature-card{
  width:min(730px,100%);margin:32px auto;
  border:1px solid var(--border);border-radius:20px;background:var(--surface-2);overflow:hidden
}
.feature-head{padding:17px 18px;border-bottom:1px solid var(--border)}
.feature-head h2{margin:4px 0 0;font-size:21px}
.feature-body{padding:18px}
.brief-result,.analysis-result,.ask-result{white-space:pre-wrap;font-size:14px;line-height:1.65}
.ask-row{display:flex;gap:8px;margin-top:11px}
.ask-row input{
  flex:1;min-width:0;border:1px solid var(--border);background:var(--surface);
  color:var(--text);border-radius:11px;padding:11px 12px;outline:0
}
.quick-prompts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.quick-prompts button{font-size:10px;padding:7px 9px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text)}

.audio-panel{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px
}
.play-circle{
  width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:17px
}
.audio-meta{min-width:0}
.audio-title{font-weight:900;font-size:13px}
.audio-sub{font-size:10px;color:var(--muted);margin-top:2px}
.audio-range{width:100%;accent-color:var(--accent)}
.speed-select{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 8px;font-weight:800}

.source-box{
  width:min(730px,100%);margin:34px auto 0;padding-top:22px;border-top:1px solid var(--border);
  color:var(--muted);font-size:12px
}
.source-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.publisher-link{display:inline-flex;padding:9px 12px;border-radius:10px;border:1px solid var(--border);text-decoration:none;font-weight:850;color:var(--text);background:var(--surface)}

.side-column{position:sticky;top:85px;display:grid;gap:15px}
.side-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:18px;box-shadow:var(--shadow-soft)
}
.side-panel h3{margin:5px 0 14px;font-size:18px}
.side-list{display:grid;gap:10px}
.related-item,.nav-story{
  display:block;text-decoration:none;padding:10px 0;border-top:1px solid var(--border)
}
.related-item:first-child,.nav-story:first-child{border-top:0;padding-top:0}
.related-item strong,.nav-story strong{display:block;font-size:12px;line-height:1.35}
.related-item small,.nav-story small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share-grid button{width:100%}

.nav-flow{
  width:min(850px,100%);margin:24px auto 0;
  display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.flow-card{
  border:1px solid var(--border);background:var(--surface);border-radius:17px;
  padding:16px;text-decoration:none;box-shadow:var(--shadow-soft)
}
.flow-card small{display:block;color:var(--muted);font-size:9px;letter-spacing:.1em;font-weight:950}
.flow-card strong{display:block;margin-top:6px;font-size:14px;line-height:1.35}
.flow-card.next{text-align:right}

.loading-card,.error-card{
  width:min(850px,100%);margin:auto;background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:45px;box-shadow:var(--shadow)
}
.error-card{color:#b42318}
.muted{color:var(--muted)}

@media(max-width:1000px){
  .article-grid{grid-template-columns:1fr}
  .side-column{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:720px){
  .header-inner{width:min(100% - 20px,1240px)}
  .reader-brand small{display:none}
  .shell{width:min(100% - 14px,1240px);padding-top:14px}
  .article-card{border-radius:20px}
  .hero{min-height:300px}
  .hero-copy{padding:20px}
  .hero-copy h1{font-size:39px}
  .article-info{padding:0 18px}
  .reader-content{padding:22px 14px 32px}
  .article-content{font-size:18px;line-height:1.78}
  .article-content>p:first-child:first-letter{font-size:3.7em}
  .side-column{grid-template-columns:1fr}
  .nav-flow{grid-template-columns:1fr}
  .flow-card.next{text-align:left}
  .audio-panel{grid-template-columns:auto 1fr}
  .speed-select{grid-column:2}
  .ask-row{flex-direction:column}
}
</style>
</head>
<body>
<div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>

<header class="reader-header">
  <div class="header-inner">
    <a class="back-btn" href="/" aria-label="Back to newsroom">←</a>
    <a class="reader-brand" href="/">
      <span class="brand-mark">V</span>
      <span>
        <strong>THE VOICE REPORTER</strong>
        <small>NEWSROOM READER</small>
      </span>
    </a>
    <div class="header-spacer"></div>
    <div class="header-actions">
      <button id="saveBtn" class="icon-btn" title="Save article" aria-label="Save article">☆</button>
      <button id="themeBtn" class="icon-btn" title="Switch theme" aria-label="Switch theme">☾</button>
      <button id="shareBtn" class="icon-btn" title="Share article" aria-label="Share article">↗</button>
    </div>
  </div>
</header>

<main class="shell">
  <div class="article-grid">
    <div>
      <article id="articleCard" class="article-card">
        <div class="loading-card">Reading the report…</div>
      </article>

      <div id="navFlow" class="nav-flow" hidden></div>
    </div>

    <aside class="side-column">
      <section class="side-panel">
        <span class="eyebrow">YOUR READING</span>
        <h3>Progress</h3>
        <div class="reading-progress-label"><strong id="progressText">0%</strong> read</div>
        <div style="height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:10px">
          <div id="sideProgress" style="height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px"></div>
        </div>
      </section>

      <section class="side-panel">
        <span class="eyebrow">RELATED</span>
        <h3>Keep reading</h3>
        <div id="relatedList" class="side-list"><span class="muted">Finding related stories…</span></div>
      </section>

      <section class="side-panel">
        <span class="eyebrow">SHARE</span>
        <h3>Send this story</h3>
        <div class="share-grid">
          <button class="action-btn" data-share="copy">Copy link</button>
          <button class="action-btn" data-share="whatsapp">WhatsApp</button>
          <button class="action-btn" data-share="facebook">Facebook</button>
          <button class="action-btn" data-share="native">More</button>
        </div>
      </section>
    </aside>
  </div>
</main>

<script>
(() => {
  "use strict";

  const qs = new URLSearchParams(location.search);
  const articleUrl = qs.get("url");
  const storyId = qs.get("id");

  const state = {
    story: null,
    external: !storyId,
    currentIndex: -1,
    stories: [],
    fontScale: 1,
    saved: false,
    speech: { utterance:null, paused:false, speaking:false },
    audioText: ""
  };

  const $ = id => document.getElementById(id);

  document.addEventListener("DOMContentLoaded", init);

  async function init() {
    initTheme();
    bindGlobal();
    await loadArticle();
    await loadNewsFlow();
    updateSaveState();
    wireArticleTools();
    updateProgress();
  }

  function bindGlobal() {
    $("themeBtn").onclick = toggleTheme;
    $("saveBtn").onclick = toggleSave;
    $("shareBtn").onclick = () => shareArticle("native");

    window.addEventListener("scroll", updateProgress, {passive:true});

    document.addEventListener("click", e => {
      const b = e.target.closest("[data-share]");
      if (b) shareArticle(b.dataset.share);
    });
  }

  function initTheme() {
    const saved = localStorage.getItem("tvr-reader-theme") || localStorage.getItem("tvr-theme") || "light";
    document.body.classList.toggle("dark", saved === "dark");
    $("themeBtn").textContent = saved === "dark" ? "☀" : "☾";
  }

  function toggleTheme() {
    const dark = !document.body.classList.contains("dark");
    const value = dark ? "dark" : "light";
    localStorage.setItem("tvr-reader-theme", value);
    document.body.classList.toggle("dark", dark);
    $("themeBtn").textContent = dark ? "☀" : "☾";
  }

  async function loadArticle() {
    try {
      if (storyId) {
        const r = await fetch("/api/story/" + encodeURIComponent(storyId), {cache:"no-store"});
        const d = await readJson(r);
        if (!r.ok || !d.ok) throw new Error(d.error || "Story not found");
        state.story = d.story;
        renderEditorial(d.story);
      } else if (articleUrl) {
        const r = await fetch("/api/article?url=" + encodeURIComponent(articleUrl), {cache:"no-store"});
        const d = await readJson(r);
        if (!r.ok || !d.ok) throw new Error(d.error || "Unable to read publisher article");
        state.story = d.article;
        renderExternal(d.article);
      } else {
        throw new Error("No article selected.");
      }
      $("articleCard").scrollIntoView({block:"start"});
    } catch (err) {
      console.error(err);
      $("articleCard").innerHTML = `<div class="error-card">${esc(err.message || "Unable to load this article.")}</div>`;
    }
  }

  async function readJson(response) {
    const text = await response.text();
    try { return JSON.parse(text); }
    catch { return {ok:false,error:text || ("Request failed: " + response.status)}; }
  }

  function renderEditorial(s) {
    const body = renderRichText(s.body || "");
    const image = safeUrl(s.image || "");
    const category = esc(s.category || "News");
    const author = esc(s.author || "THE VOICE REPORTER");
    const time = formatDate(s.publishedAt || s.updatedAt || s.createdAt);
    document.title = `${s.title || "Article"} — THE VOICE REPORTER`;

    $("articleCard").innerHTML = `
      ${heroHtml(image, s.title, s.category, s.subheadline)}
      <div class="article-info">
        <div class="info-row">
          <div class="byline">By <strong>${author}</strong> · ${time}</div>
          <div class="actions">
            <button class="action-btn primary" id="listenBtn">▶ Listen</button>
            <button class="action-btn" id="briefBtn">⚡ Quick Brief</button>
            <button class="action-btn" id="analysisBtn">🧠 Deep Analysis</button>
          </div>
        </div>
      </div>
      <div class="reader-content">
        ${readingToolsHtml()}
        <div id="editorialVideoHost">${renderVideoMarkup(s.video || "")}</div>
        <div id="contentBody" class="article-content">${body}</div>
        <div class="feature-mount">${featureCardsHtml()}</div>
        <div class="source-box">
          <strong>${esc(s.sourceAttribution || "Original story published by THE VOICE REPORTER")}</strong>
          ${s.imageCaption ? `<div class="muted" style="margin-top:7px">${esc(s.imageCaption)}</div>` : ""}
        </div>
      </div>`;
    state.audioText = stripHtml(`${s.title}. ${s.subheadline || ""}. ${s.body || ""}`);
  }

  function renderExternal(a) {
    let html = normalizePublisherHtml(a.content || "");
    html = sanitizeArticleHtml(html);

    const firstImage = extractFirstImage(html);
    if (firstImage) html = removeFirstImage(html);

    const title = a.title || "Article";
    const site = a.siteName || "Original publisher";
    const byline = a.byline ? `By ${esc(a.byline)}` : "";
    const time = a.publishedTime ? formatDate(a.publishedTime) : "";
    document.title = `${title} — THE VOICE REPORTER`;

    $("articleCard").innerHTML = `
      ${heroHtml(firstImage, title, site, a.excerpt || "")}
      <div class="article-info">
        <div class="info-row">
          <div class="byline">${byline}${byline && time ? " · " : ""}${time}</div>
          <div class="actions">
            <button class="action-btn primary" id="listenBtn">▶ Listen</button>
            <button class="action-btn" id="briefBtn">⚡ Quick Brief</button>
            <button class="action-btn" id="analysisBtn">🧠 Deep Analysis</button>
          </div>
        </div>
      </div>
      <div class="reader-content">
        ${readingToolsHtml()}
        <div id="contentBody" class="article-content">${html || `<p>${esc(a.excerpt || "")}</p>`}</div>
        <div class="feature-mount">${featureCardsHtml()}</div>
        <div class="source-box">
          <strong>Article supplied by ${esc(site)}</strong>
          <div class="source-actions">
            <a class="publisher-link" href="${safeUrl(a.url || articleUrl)}" target="_blank" rel="noopener noreferrer">Original publisher ↗</a>
          </div>
        </div>
      </div>`;
    state.audioText = stripHtml(`${title}. ${a.excerpt || ""}. ${html}`);
  }

  function heroHtml(image,title,label,dek) {
    const bg = image
      ? `style="background-image:url('${image.replace(/'/g,"%27")}')"`
      : "";
    return `<div class="hero ${image ? "" : "fallback-hero"}" ${bg}>
      <div class="hero-copy">
        <div class="eyebrow">${esc(label || "NEWS")}</div>
        <h1>${esc(title || "Article")}</h1>
        ${dek ? `<div class="dek">${esc(stripHtml(dek))}</div>` : ""}
      </div>
    </div>`;
  }

  function readingToolsHtml() {
    return `<div class="reading-tools">
      <span class="tool-label">TEXT</span>
      <button class="tool-btn" id="fontDown">A−</button>
      <button class="tool-btn" id="fontReset">A</button>
      <button class="tool-btn" id="fontUp">A+</button>
      <span class="reading-size" id="fontLabel">100%</span>
      <span class="tool-spacer"></span>
      <button class="tool-btn" id="saveInline">☆ Save</button>
      <button class="tool-btn" id="shareInline">↗ Share</button>
    </div>`;
  }

  function featureCardsHtml() {
    return `
      <section class="feature-card" id="audioCard">
        <div class="feature-head"><span class="eyebrow">LISTEN</span><h2>Listen to this story</h2></div>
        <div class="feature-body audio-panel">
          <button class="play-circle" id="audioPlay">▶</button>
          <div class="audio-meta">
            <div class="audio-title" id="audioTitle">Ready to read aloud</div>
            <div class="audio-sub">Browser narration · adjustable speed</div>
            <input id="audioProgress" class="audio-range" type="range" min="0" max="100" value="0">
          </div>
          <select id="audioSpeed" class="speed-select" aria-label="Narration speed">
            <option value="0.8">0.8×</option>
            <option value="1" selected>1×</option>
            <option value="1.15">1.15×</option>
            <option value="1.3">1.3×</option>
            <option value="1.5">1.5×</option>
          </select>
        </div>
      </section>

      <section class="feature-card" id="briefCard">
        <div class="feature-head"><span class="eyebrow">QUICK BRIEF</span><h2>Get the story in seconds</h2></div>
        <div class="feature-body">
          <button class="action-btn primary" id="briefInside">Generate Quick Brief</button>
          <div class="brief-result" id="briefResult" style="margin-top:14px"><span class="muted">Your brief will appear here.</span></div>
        </div>
      </section>

      <section class="feature-card" id="askCard">
        <div class="feature-head"><span class="eyebrow">ASK THIS STORY</span><h2>Have a question?</h2></div>
        <div class="feature-body">
          <div class="quick-prompts">
            <button data-q="Explain this story simply.">Explain simply</button>
            <button data-q="Why is this important?">Why it matters</button>
            <button data-q="Who is affected?">Who is affected?</button>
            <button data-q="What happens next?">What happens next?</button>
          </div>
          <div class="ask-row">
            <input id="askInput" placeholder="Ask anything about this story…">
            <button class="action-btn primary" id="askBtn">Ask AI</button>
          </div>
          <div class="ask-result" id="askResult" style="margin-top:14px"><span class="muted">The answer will use this story as context.</span></div>
        </div>
      </section>

      <section class="feature-card" id="analysisCard">
        <div class="feature-head"><span class="eyebrow">DEEP ANALYSIS</span><h2>Go beyond the headline</h2></div>
        <div class="feature-body">
          <button class="action-btn primary" id="analysisInside">Analyze this story</button>
          <div class="analysis-result" id="analysisResult" style="margin-top:14px"><span class="muted">Analysis will appear here.</span></div>
        </div>
      </section>`;
  }

  function wireArticleTools() {
    $("fontDown")?.addEventListener("click", () => changeFont(-.08));
    $("fontReset")?.addEventListener("click", () => changeFont(1 - state.fontScale));
    $("fontUp")?.addEventListener("click", () => changeFont(.08));
    $("saveInline")?.addEventListener("click", toggleSave);
    $("shareInline")?.addEventListener("click", () => shareArticle("native"));
    $("listenBtn")?.addEventListener("click", () => scrollToAudio());
    $("briefBtn")?.addEventListener("click", () => requestBrief());
    $("analysisBtn")?.addEventListener("click", () => requestAnalysis());
    $("briefInside")?.addEventListener("click", requestBrief);
    $("analysisInside")?.addEventListener("click", requestAnalysis);
    $("askBtn")?.addEventListener("click", requestAsk);
    $("askInput")?.addEventListener("keydown", e => { if (e.key === "Enter") requestAsk(); });
    document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
      $("askInput").value = b.dataset.q;
      requestAsk();
    });

    const p = $("audioProgress");
    p?.addEventListener("input", () => {
      if (!state.speech.utterance || !("speechSynthesis" in window)) return;
    });
    $("audioPlay")?.addEventListener("click", toggleSpeech);
    $("audioSpeed")?.addEventListener("change", toggleSpeed);

    const video = document.querySelector(".article-content video,#editorialVideoHost video");
    if (video) video.addEventListener("loadedmetadata", () => {});
  }

  function changeFont(delta) {
    state.fontScale = Math.min(1.3, Math.max(.86, state.fontScale + delta));
    const body = $("contentBody");
    if (body) body.style.fontSize = (20 * state.fontScale) + "px";
    $("fontLabel").textContent = Math.round(state.fontScale * 100) + "%";
  }

  function scrollToAudio() {
    $("audioCard")?.scrollIntoView({behavior:"smooth",block:"center"});
    setTimeout(() => startSpeech(), 350);
  }

  function toggleSpeed() {
    if (state.speech.utterance && state.speech.speaking) {
      speechSynthesis.cancel();
      state.speech.utterance = null;
      startSpeech();
    }
  }

  function startSpeech() {
    if (!("speechSynthesis" in window)) { alert("Speech is not supported by this browser."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(state.audioText || "");
    u.rate = Number($("audioSpeed")?.value || 1);
    u.pitch = 1;
    u.volume = 1;
    const voices = speechSynthesis.getVoices();
    const selected = voices.find(v => /en-NG/i.test(v.lang)) || voices.find(v => /^en(-|_)/i.test(v.lang)) || voices[0];
    if (selected) u.voice = selected;
    u.onstart = () => {
      state.speech.speaking = true;
      $("audioPlay").textContent = "❚❚";
      $("audioTitle").textContent = "Reading this story…";
    };
    u.onend = () => {
      state.speech.speaking = false;
      state.speech.utterance = null;
      $("audioPlay").textContent = "▶";
      $("audioTitle").textContent = "Finished";
      $("audioProgress").value = 100;
    };
    state.speech.utterance = u;
    speechSynthesis.speak(u);
  }

  function toggleSpeech() {
    if (!("speechSynthesis" in window)) return alert("Speech is not supported by this browser.");
    if (speechSynthesis.speaking && !speechSynthesis.paused) {
      speechSynthesis.pause();
      $("audioPlay").textContent = "▶";
      $("audioTitle").textContent = "Paused";
      return;
    }
    if (speechSynthesis.paused) {
      speechSynthesis.resume();
      $("audioPlay").textContent = "❚❚";
      $("audioTitle").textContent = "Reading this story…";
      return;
    }
    startSpeech();
  }

  async function requestBrief() {
    const target = $("briefResult");
    if (!target) return;
    target.textContent = "Preparing the quick brief…";
    try {
      const data = await ai("/chat", {
        system: "You are THE VOICE REPORTER Quick Brief editor. Summarize the supplied article into: What happened, Why it matters, What is known, What remains uncertain. Be concise and factual. Do not invent details.",
        messages:[{role:"user",content:articleContext()}],
        temperature:.2,max_tokens:700
      });
      target.textContent = data.text || data.error || "No brief returned.";
    } catch(e) {
      target.textContent = "Quick Brief is unavailable right now.";
    }
    $("briefCard")?.scrollIntoView({behavior:"smooth",block:"center"});
  }

  async function requestAnalysis() {
    const target = $("analysisResult");
    if (!target) return;
    target.textContent = "Preparing deep analysis…";
    try {
      const data = await ai("/expert", {
        system: "You are the THE VOICE REPORTER senior analysis desk. Analyze the supplied article. Structure the response as: Background, What changed, Why it matters, Potential implications, Uncertainty. Use the article as the primary source and do not invent facts.",
        messages:[{role:"user",content:articleContext()}],
        temperature:.2,max_tokens:1200
      });
      target.textContent = data.text || data.error || "No analysis returned.";
    } catch(e) {
      target.textContent = "Deep Analysis is unavailable right now.";
    }
    $("analysisCard")?.scrollIntoView({behavior:"smooth",block:"center"});
  }

  async function requestAsk() {
    const q = $("askInput")?.value.trim();
    const target = $("askResult");
    if (!q) return;
    target.textContent = "Thinking…";
    try {
      const data = await ai("/chat", {
        system: "You are THE VOICE REPORTER article assistant. Answer questions about the supplied article using its content as context. Separate what the article says from anything uncertain. Do not invent facts.",
        messages:[{role:"user",content:`QUESTION: ${q}\n\nARTICLE:\n${articleContext()}`}],
        temperature:.2,max_tokens:800
      });
      target.textContent = data.text || data.error || "No answer returned.";
    } catch(e) {
      target.textContent = "The article assistant is unavailable right now.";
    }
  }

  async function ai(path, body) {
    const r = await fetch("/api/ai" + path, {
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
    const text=await r.text();
    let d;try{d=JSON.parse(text)}catch{d={success:false,error:text}};
    if(!r.ok || d.success===false) throw new Error(d.error || "AI request failed");
    return d;
  }

  function articleContext() {
    const title = state.story?.title || "";
    const by = state.story?.byline || state.story?.author || "";
    const text = stripHtml(state.audioText || document.querySelector(".article-content")?.innerText || "");
    return `TITLE: ${title}\nAUTHOR: ${by}\n\nARTICLE:\n${text.slice(0,28000)}`;
  }

  async function loadNewsFlow() {
    try {
      const r = await fetch("/api/news-lite?limit=160&t="+Date.now(),{cache:"no-store"});
      const d = await readJson(r);
      if (!r.ok || d.ok===false) return;
      state.stories = Array.isArray(d.items) ? d.items : [];
      if (!state.stories.length) return;

      if (storyId) state.currentIndex = state.stories.findIndex(x => x.id === storyId);
      else if (articleUrl) state.currentIndex = state.stories.findIndex(x => String(x.link) === String(articleUrl));

      renderNavFlow();
      renderRelated();
    } catch(e) {
      console.warn("reader flow",e);
    }
  }

  function renderNavFlow() {
    const root=$("navFlow");
    if (state.currentIndex<0) return;
    const prev=state.stories[state.currentIndex-1];
    const next=state.stories[state.currentIndex+1];
    if(!prev&&!next)return;

    root.hidden=false;
    root.innerHTML = `
      ${prev ? `<a class="flow-card" href="${storyHref(prev)}"><small>← PREVIOUS STORY</small><strong>${esc(prev.title)}</strong></a>` : `<div></div>`}
      ${next ? `<a class="flow-card next" href="${storyHref(next)}"><small>NEXT STORY →</small><strong>${esc(next.title)}</strong></a>` : `<div></div>`}`;
  }

  function renderRelated() {
    const root=$("relatedList");
    if (!state.stories.length) { root.innerHTML='<span class="muted">No related stories available.</span>'; return; }

    const category = state.story?.category;
    const titleWords = new Set(normalize(state.story?.title).split(" ").filter(w=>w.length>4));
    const related = state.stories
      .filter((x,i)=>i!==state.currentIndex)
      .map(x => {
        const words=normalize(x.title).split(" ");
        const overlap=words.filter(w=>titleWords.has(w)).length;
        const categoryScore=(category&&x.category===category)?2:0;
        return {x,score:overlap+categoryScore};
      })
      .sort((a,b)=>b.score-a.score)
      .slice(0,5)
      .map(v=>v.x);

    root.innerHTML = related.length
      ? related.map(x=>`<a class="related-item" href="${storyHref(x)}"><strong>${esc(x.title)}</strong><small>${esc(x.category||"News")} · ${formatDate(x.publishedAt)}</small></a>`).join("")
      : '<span class="muted">No related stories available.</span>';
  }

  function storyHref(x) {
    return x.editorial ? "/article?id="+encodeURIComponent(x.id) : "/article?url="+encodeURIComponent(x.link || "");
  }

  function toggleSave() {
    const key = location.href;
    const saved = JSON.parse(localStorage.getItem("tvr-saved") || "[]");
    const i=saved.indexOf(key);
    if(i>=0){saved.splice(i,1);state.saved=false}
    else{saved.unshift(key);state.saved=true}
    localStorage.setItem("tvr-saved",JSON.stringify(saved.slice(0,200)));
    updateSaveState();
  }

  function updateSaveState() {
    const saved=JSON.parse(localStorage.getItem("tvr-saved")||"[]");
    state.saved=saved.includes(location.href);
    $("saveBtn").textContent=state.saved?"★":"☆";
    $("saveBtn").classList.toggle("saved",state.saved);
    const inline=$("saveInline"); if(inline){inline.textContent=state.saved?"★ Saved":"☆ Save";inline.classList.toggle("saved",state.saved)}
  }

  async function shareArticle(kind) {
    const title=state.story?.title || document.title;
    const link=location.href;
    if(kind==="copy"){
      try{await navigator.clipboard.writeText(link); toast("Link copied");}catch{toast("Copy failed")}
      return;
    }
    if(kind==="whatsapp"){window.open("https://wa.me/?text="+encodeURIComponent(title+" "+link),"_blank");return;}
    if(kind==="facebook"){window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(link),"_blank");return;}
    if(navigator.share){try{await navigator.share({title,text:title,url:link});}catch(_){}}
    else{try{await navigator.clipboard.writeText(link);toast("Link copied");}catch{toast("Share unavailable")}}
  }

  function updateProgress() {
    const body=document.documentElement;
    const max=Math.max(1,body.scrollHeight-window.innerHeight);
    const pct=Math.min(100,Math.max(0,(window.scrollY/max)*100));
    $("progressBar").style.width=pct+"%";
    $("sideProgress").style.width=pct+"%";
    $("progressText").textContent=Math.round(pct)+"%";
  }

  function extractFirstImage(html) {
    const doc=new DOMParser().parseFromString(html,"text/html");
    const img=doc.querySelector("img");
    return img ? safeUrl(img.getAttribute("src")||img.getAttribute("data-src")||"") : "";
  }

  function removeFirstImage(html) {
    const doc=new DOMParser().parseFromString(html,"text/html");
    doc.querySelector("img")?.remove();
    return doc.body.innerHTML;
  }

  function renderRichText(text) {
    const normalized = normalizePublisherHtml(text);
    if (/<[a-z][\s\S]*>/i.test(normalized)) return sanitizeArticleHtml(normalized);
    return normalized.split(/\n{2,}|\n/).filter(Boolean).map(p=>`<p>${esc(p.trim())}</p>`).join("");
  }

  function normalizePublisherHtml(input) {
    let s=String(input||"");
    for(let i=0;i<4;i++){
      s=s.replace(/\\u([0-9a-fA-F]{4})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
      s=s.replace(/\\r/g,"\r").replace(/\\n/g,"\n").replace(/\\t/g,"\t").replace(/\\"/g,'"').replace(/\\'/g,"'");
      s=s.replace(/\\\\/g,"\\");
      const t=s.trim();
      if((t.startsWith('"')&&t.endsWith('"'))||(t.startsWith("{")&&t.endsWith("}"))){
        try{const parsed=JSON.parse(t);if(typeof parsed==="string"){s=parsed;continue;}if(parsed&&typeof parsed==="object"){if(typeof parsed.content==="string"){s=parsed.content;continue;}if(typeof parsed.body==="string"){s=parsed.body;continue;}}}catch(_){}
      }
      break;
    }
    return s.replace(/\u0000/g,"");
  }

  function sanitizeArticleHtml(input) {
    const doc=new DOMParser().parseFromString(input,"text/html");
    doc.querySelectorAll("script,style,noscript,object,embed,form,template,meta,link").forEach(n=>n.remove());

    const allowedIframeHosts=["youtube.com","www.youtube.com","youtube-nocookie.com","www.youtube-nocookie.com","player.vimeo.com","vimeo.com"];

    doc.querySelectorAll("*").forEach(el=>{
      [...el.attributes].forEach(attr=>{
        const n=attr.name.toLowerCase(),v=attr.value;
        if(n.startsWith("on")||n==="style"||n==="srcset"||n==="class"||n==="id") el.removeAttribute(attr.name);
        if((n==="href"||n==="src"||n==="poster") && !safeResource(v)) el.removeAttribute(attr.name);
      });

      if(el.tagName==="IFRAME"){
        try{
          const u=new URL(el.getAttribute("src")||"",location.href);
          const host=u.hostname.toLowerCase();
          if(!allowedIframeHosts.some(h=>host===h||host.endsWith("."+h))) el.remove();
          else{el.setAttribute("loading","lazy");el.setAttribute("referrerpolicy","strict-origin-when-cross-origin");}
        }catch{el.remove()}
      }
    });

    doc.querySelectorAll("img").forEach(img=>{
      const src=img.getAttribute("src")||img.getAttribute("data-src")||"";
      if(!src || !safeResource(src)) img.remove();
      else{
        img.loading="lazy";img.decoding="async";
        const alt=img.getAttribute("alt")||"";
        if(alt) img.setAttribute("alt",alt.slice(0,200));
      }
    });

    doc.querySelectorAll("a").forEach(a=>{
      const href=a.getAttribute("href");
      if(href && safeResource(href)){a.setAttribute("target","_blank");a.setAttribute("rel","noopener noreferrer")}
    });

    doc.querySelectorAll("video,source").forEach(el=>{
      const src=el.getAttribute("src");
      if(src && !safeResource(src)) el.removeAttribute("src");
    });

    return doc.body.innerHTML;
  }

  function safeResource(v) {
    try{
      const u=new URL(v,location.href);
      return /^(https?:|mailto:)$/.test(u.protocol);
    }catch{return false}
  }

  function safeUrl(v){
    try{
      const u=new URL(v,location.href);
      return /^(https?:)$/.test(u.protocol)?u.href:"";
    }catch{return ""}
  }

  function renderVideoMarkup(v) {
    const u=safeUrl(v);
    return u ? `<video class="article-content video" controls playsinline preload="metadata" src="${u}"></video>` : "";
  }

  function stripHtml(v) {
    const div=document.createElement("div");
    div.innerHTML=String(v||"");
    return div.textContent||div.innerText||"";
  }

  function normalize(v){return String(v||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
  function formatDate(v){const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleString([],{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})}
  function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

  let toastTimer;
  function toast(message){
    let el=document.getElementById("readerToast");
    if(!el){el=document.createElement("div");el.id="readerToast";el.style.cssText="position:fixed;left:50%;bottom:22px;z-index:100;transform:translate(-50%,20px);opacity:0;background:#101828;color:#fff;padding:11px 15px;border-radius:12px;font:700 12px Inter,sans-serif;transition:.2s ease;pointer-events:none";document.body.appendChild(el)}
    el.textContent=message;el.style.opacity="1";el.style.transform="translate(-50%,0)";
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.opacity="0";el.style.transform="translate(-50%,20px)"},2200);
  }
})();
</script>
