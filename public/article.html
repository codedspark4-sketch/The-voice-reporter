<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE VOICE REPORTER — Article</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--text:#101828;--muted:#667085;--border:#e4e7ec;--red:#be1212;--gold:#b8892f}body.dark{--bg:#080d15;--surface:#111824;--text:#f7f9fb;--muted:#9aa6b4;--border:#293445}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}.top{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--border);padding:16px}.top-inner{max-width:920px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:950;letter-spacing:.08em;text-decoration:none}.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:850;cursor:pointer}.wrap{max-width:900px;margin:auto;padding:25px 15px 80px}.reader{background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.07);overflow:hidden}.cover{width:100%;max-height:540px;object-fit:cover;background:#111}.body{padding:30px}.meta{color:var(--gold);font-size:11px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.title{font:900 clamp(36px,7vw,66px)/1.02 Georgia,serif;letter-spacing:-.03em;margin:10px 0 15px}.sub{font-size:19px;color:var(--muted);margin:0 0 20px}.byline{font-size:12px;color:var(--muted);margin-bottom:22px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}.primary{background:var(--red);color:#fff;border-color:var(--red)}.article-body{font:19px/1.8 Georgia,serif}.article-body p{margin:0 0 18px}.article-body img{max-width:100%;height:auto;border-radius:12px}.video{width:100%;margin:15px 0;border-radius:13px;background:#000}.caption{font-size:11px;color:var(--muted);margin-top:-10px;margin-bottom:15px}.source{border-top:1px solid var(--border);margin-top:28px;padding-top:18px;font-size:12px;color:var(--muted)}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.loading,.error{padding:25px;color:var(--muted)}.error{color:#b42318}@media(max-width:600px){.body{padding:20px}.article-body{font-size:18px}.title{font-size:37px}}
</style>
</head>
<body><header class="top"><div class="top-inner"><a class="brand" href="/">THE VOICE REPORTER</a><div><button id="theme" class="btn">☾</button><a class="btn" href="/">← Newsroom</a></div></div></header>
<main class="wrap"><article class="reader" id="reader"><div class="loading">Loading article…</div></article><div class="nav"><button class="btn" id="prevBtn" hidden>← Previous</button><button class="btn" id="nextBtn" hidden>Next →</button></div></main>
<script>
const qs=new URLSearchParams(location.search);const url=qs.get('url');const id=qs.get('id');const reader=document.getElementById('reader');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function safe(v){try{const u=new URL(v,location.origin);return /^(https?:)$/.test(u.protocol)?u.href:'#'}catch{return '#'}}
function paragraphize(v){return String(v||'').split(/\n{2,}|\n/).map(x=>x.trim()).filter(Boolean).map(x=>'<p>'+esc(x)+'</p>').join('')}
function theme(){const t=localStorage.getItem('tvr-theme')||'light';document.body.classList.toggle('dark',t==='dark');document.getElementById('theme').textContent=t==='dark'?'☀':'☾'}
document.getElementById('theme').onclick=()=>{const dark=!document.body.classList.contains('dark');localStorage.setItem('tvr-theme',dark?'dark':'light');theme()};theme();
async function load(){try{if(id){const r=await fetch('/api/story/'+encodeURIComponent(id));const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Story not found');renderEditorial(d.story);return;}if(url){const r=await fetch('/api/article?url='+encodeURIComponent(url));const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Unable to read publisher article');renderExternal(d.article);return;}throw new Error('No article selected.')}catch(e){reader.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function renderEditorial(s){document.title=s.title+' — THE VOICE REPORTER';reader.innerHTML='<div>'+ (s.image?'<img class="cover" src="'+safe(s.image)+'" alt="">':'') +'</div><div class="body"><div class="meta">'+esc(s.category)+' · THE VOICE REPORTER</div><h1 class="title">'+esc(s.title)+'</h1>'+(s.subheadline?'<p class="sub">'+esc(s.subheadline)+'</p>':'')+'<div class="byline">By '+esc(s.author||'THE VOICE REPORTER')+' · '+esc(new Date(s.publishedAt||s.updatedAt||s.createdAt).toLocaleString())+'</div><div class="actions"><button class="btn primary" onclick="speak('+JSON.stringify(s.title+' '+(s.subheadline||'')+' '+(s.body||'')).replace(/</g,'\\u003c')+')">▶ Listen</button></div>'+(s.video?'<video class="video" controls playsinline src="'+safe(s.video)+'"></video>':'')+(s.videoCaption?'<div class="caption">'+esc(s.videoCaption)+'</div>':'')+'<div class="article-body">'+paragraphize(s.body)+'</div>'+(s.imageCaption?'<div class="caption">'+esc(s.imageCaption)+'</div>':'')+'<div class="source">'+esc(s.sourceAttribution||'Original story published by THE VOICE REPORTER')+'</div></div>'}
function renderExternal(a){document.title=(a.title||'Article')+' — THE VOICE REPORTER';reader.innerHTML='<div class="body"><div class="meta">'+esc(a.siteName||'Original publisher')+'</div><h1 class="title">'+esc(a.title)+'</h1>'+(a.byline?'<div class="byline">By '+esc(a.byline)+'</div>':'')+'<div class="actions"><button class="btn primary" onclick="speak('+JSON.stringify(a.title+' '+(a.excerpt||'')+' '+(a.content||'')).replace(/</g,'\\u003c')+')">▶ Listen</button><a class="btn" href="'+safe(a.url||url)+'" target="_blank" rel="noopener">Original publisher</a></div><div class="article-body">'+a.content+'</div><div class="source">Article supplied by '+esc(a.siteName||'the original publisher')+'</div></div>'}
function speak(text){if(!('speechSynthesis'in window))return alert('Speech is not supported in this browser.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,' '));speechSynthesis.speak(u)}
load();
</script></body></html>
