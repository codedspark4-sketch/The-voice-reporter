<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE VOICE REPORTER — Article</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#fff}
*{box-sizing:border-box}body{margin:0;background:#f5f5f5}.top{background:#111;color:#fff;padding:16px 22px}
.top a{color:#fff;text-decoration:none;font-weight:700}.wrap{max-width:850px;margin:0 auto;padding:28px 18px 70px}
.reader{background:#fff;border-radius:18px;padding:30px;box-shadow:0 8px 30px #00000012}
.meta{color:#777;font-size:14px;margin-bottom:12px}.title{font-size:clamp(32px,6vw,54px);line-height:1.05;margin:0 0 18px}
.byline{color:#555;margin-bottom:24px}.loading{font-size:18px;color:#666;padding:35px 0}
.article-body{font-family:Georgia,serif;font-size:19px;line-height:1.75;color:#222}
.article-body img{max-width:100%;height:auto;border-radius:12px;margin:18px 0}
.article-body a{color:#0b57d0}.source{margin-top:32px;padding-top:20px;border-top:1px solid #ddd;font:14px system-ui,sans-serif}
.source a{color:#0b57d0}.back{display:inline-block;margin-bottom:20px;color:#111;text-decoration:none;font-weight:700}
.error{padding:20px;border-radius:12px;background:#fff0f0;color:#8a1c1c}
</style>
</head>
<body>
<header class="top"><a href="/">THE VOICE REPORTER</a></header>
<main class="wrap">
<a class="back" href="/">← Back to news</a>
<article class="reader">
<div id="article">Loading article…</div>
</article>
</main>
<script>
(function(){
  const root=document.getElementById("article");
  const url=new URLSearchParams(location.search).get("url");
  if(!url){root.innerHTML='<div class="error">No article was selected.</div>';return;}
  root.innerHTML='<div class="loading">Reading the article…</div>';
  fetch("/api/article?url="+encodeURIComponent(url),{cache:"no-store"})
    .then(r=>r.json().then(d=>({ok:r.ok,data:d})))
    .then(({ok,data})=>{
      if(!ok||!data.ok) throw new Error(data.error||"Unable to read article");
      const a=data.article;
      document.title=(a.title||"Article")+" — THE VOICE REPORTER";
      root.innerHTML=
        '<div class="meta">'+esc(a.siteName||"News")+" · "+esc(a.publishedTime||"")+'</div>'+
        '<h1 class="title">'+esc(a.title)+'</h1>'+
        (a.byline?'<div class="byline">By '+esc(a.byline)+'</div>':'')+
        '<div class="article-body">'+a.content+'</div>'+
        '<div class="source">Article supplied by '+esc(a.siteName||"the original publisher")+
        '. <a href="'+safe(a.url||url)+'" target="_blank" rel="noopener noreferrer">View original article</a></div>';
    })
    .catch(e=>{
      root.innerHTML='<div class="error">'+esc(e.message)+'</div>';
    });
  function esc(v){return String(v||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function safe(v){try{const u=new URL(v);return (u.protocol==="http:"||u.protocol==="https:")?u.href.replace(/"/g,"%22"):"#"}catch(_){return "#"}}
})();
</script>
</body>
</html>
