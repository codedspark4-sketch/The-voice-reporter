<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Writer Login — THE VOICE REPORTER</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:system-ui;color:#111827}.card{width:min(460px,calc(100% - 30px));background:#fff;border:1px solid #e4e7ec;border-radius:24px;padding:30px;box-shadow:0 18px 50px #10182818}.k{color:#be1212;font-weight:900;letter-spacing:.12em;font-size:11px}.logo{font-size:20px;font-weight:900;margin:8px 0 24px}.field{display:grid;gap:7px;margin:15px 0}.field input{padding:13px;border:1px solid #d0d5dd;border-radius:11px;font:inherit}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#be1212;color:#fff;font-weight:900;cursor:pointer}.err{color:#b42318;min-height:22px;margin-top:10px}.back{display:block;margin-top:18px;color:#667085;text-align:center}</style></head><body><form class="card" id="form"><div class="k">EDITORIAL WORKSPACE</div><div class="logo">THE VOICE REPORTER — WRITERS</div><div class="field"><label>Username or email</label><input id="username" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn">Writer Login</button><div id="err" class="err"></div><a class="back" href="/">← Return to newsroom</a></form><script>form.onsubmit=async e=>{e.preventDefault();err.textContent='';try{const r=await fetch('/api/auth/writer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!d.ok)throw new Error(d.error);location.href='/writer/dashboard'}catch(x){err.textContent=x.message||'Login failed'}};</script></body></html>
