<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Writer Workspace — THE VOICE REPORTER</title><style>body{margin:0;background:#f5f7fb;color:#101828;font-family:Inter,system-ui,sans-serif}.top{background:#0f172a;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.top b{letter-spacing:.05em}.wrap{max-width:1250px;margin:auto;padding:24px 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid #d0d5dd;background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:800}.tab.active{background:#be1212;color:#fff;border-color:#be1212}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:20px;box-shadow:0 12px 35px #10182810}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:12px;color:#667085;font-weight:800}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;box-sizing:border-box;font:inherit;background:#fff}.field textarea{min-height:320px;resize:vertical}.btn{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:#be1212;color:#fff;border-color:#be1212}.green{background:#087443;color:#fff;border-color:#087443}.list{display:grid;gap:10px}.story{border:1px solid #e4e7ec;border-radius:13px;padding:13px}.story h3{margin:0 0 5px}.muted{color:#667085}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.preview{background:#111827;color:#fff;border-radius:14px;padding:22px;white-space:pre-wrap;min-height:420px}.preview h1{font:900 38px/1.08 Georgia,serif}.msg{padding:10px 12px;background:#eef2f8;border-radius:9px;margin:10px 0}.danger{color:#b42318}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><b>THE VOICE REPORTER · WRITER WORKSPACE</b><span id="who"></span></header><main class="wrap"><div class="tabs"><button class="tab active" data-view="dashboard">My Stories</button><button class="tab" data-view="editor">Create Story</button><button class="tab" id="logout">Log out</button></div><section id="dashboard" class="panel"><div class="tools"><button class="btn primary" id="new">Create new story</button><button class="btn" id="reload">Reload</button></div><div id="list" class="list"></div></section><section id="editor" class="panel" style="display:none"><input type="hidden" id="id"><div class="grid"><div><div class="field"><label>Headline</label><input id="title"></div><div class="field"><label>Subheadline</label><input id="sub"></div><div class="grid"><div class="field"><label>Category</label><select id="cat"><option>Nigeria</option><option>Politics</option><option>Business</option><option>Technology</option><option>Sports</option><option>World</option><option>Africa</option><option>Entertainment</option><option>Science</option></select></div><div class="field"><label>Tags</label><input id="tags"></div></div><div class="field"><label>Article body</label><textarea id="body"></textarea></div><div class="grid"><div class="field"><label>Image URL</label><input id="image"></div><div class="field"><label>Source / attribution</label><input id="source"></div></div><div class="tools"><button class="btn" id="aiTitle">AI headline ideas</button><button class="btn" id="aiImprove">AI improve draft</button><button class="btn" id="aiSeo">AI SEO</button></div><div class="tools"><button class="btn" id="save">Save draft</button><button class="btn green" id="submit">Submit for review</button></div><div id="msg" class="msg"></div></div><div><div class="preview"><div class="muted" id="meta">THE VOICE REPORTER</div><h1 id="pvTitle">Your headline</h1><div id="pvSub"></div><p id="pvBody">Your article preview will appear here.</p></div></div></div></section></main><script>
let editing=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});const d=await r.json().catch(()=>({ok:false,error:'Invalid response'}));if(r.status===401){location.href='/writer-login';throw new Error('Session expired')}if(!r.ok||d.ok===false)throw new Error(d.error||'Request failed');return d}
async function init(){const m=await api('/api/auth/me');if(!m.authenticated||!['writer','editor'].includes(m.user.role)){location.href='/writer-login';return}$('who').textContent=(m.user.name||m.user.username)+' · '+m.user.role;loadStories();bind()}
function bind(){document.querySelectorAll('.tab[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));$('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/writer-login'};$('new').onclick=newStory;$('reload').onclick=loadStories;$('save').onclick=()=>save('draft');$('submit').onclick=()=>save('submitted');['title','sub','body','cat'].forEach(id=>$(id).addEventListener('input',preview));$('aiTitle').onclick=aiTitle;$('aiImprove').onclick=aiImprove;$('aiSeo').onclick=aiSeo}
function view(v){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('dashboard').style.display=v==='dashboard'?'block':'none';$('editor').style.display=v==='editor'?'block':'none'}
async function loadStories(){const d=await api('/api/writer/stories');$('list').innerHTML=d.stories.map(s=>`<article class="story"><h3>${esc(s.title)}</h3><div class="muted">${esc(s.category)} · ${esc(s.status)} · ${esc(s.updatedAt||'')}</div><div class="tools"><button class="btn" onclick='edit(${JSON.stringify(s).replace(/'/g,'&#39;')})'>Edit</button></div></article>`).join('')||'<div class="muted">No stories yet.</div>'}
function newStory(){editing=null;$('id').value='';['title','sub','body','tags','image','source'].forEach(x=>$(x).value='');$('cat').value='Nigeria';$('msg').textContent='New story.';preview();view('editor')}
function edit(s){editing=s;$('id').value=s.id;$('title').value=s.title||'';$('sub').value=s.subheadline||'';$('body').value=s.body||'';$('cat').value=s.category||'Nigeria';$('tags').value=(s.tags||[]).join(', ');$('image').value=s.image||'';$('source').value=s.sourceAttribution||'';$('msg').textContent='Editing '+s.status;preview();view('editor')}
function data(status){return {title:$('title').value,subheadline:$('sub').value,body:$('body').value,category:$('cat').value,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),image:$('image').value,sourceAttribution:$('source').value,status}}
async function save(status){if(!$('title').value.trim()||!$('body').value.trim()){return $('msg').textContent='Headline and body are required.'}try{const r=await api(editing?'/api/writer/stories/'+editing.id:'/api/writer/stories',{method:editing?'PATCH':'POST',body:JSON.stringify(data(status))});editing=r.story;$('id').value=r.story.id;$('msg').textContent='Saved as '+r.story.status+'.';loadStories()}catch(e){$('msg').textContent=e.message}}
async function aiTitle(){const r=await api('/api/ai/chat',{method:'POST',body:JSON.stringify({system:'Create five professional news headlines from the supplied draft. Do not invent facts.',messages:[{role:'user',content:$('body').value.slice(0,8000)}]})});$('msg').textContent=r.text||r.error||''}
async function aiImprove(){const r=await api('/api/ai/expert',{method:'POST',body:JSON.stringify({system:'Improve the supplied article for professional newsroom clarity while preserving facts. Return only the revised article.',messages:[{role:'user',content:$('body').value.slice(0,12000)}]})});if(r.text)$('body').value=r.text;preview()}
async function aiSeo(){const r=await api('/api/ai/chat',{method:'POST',body:JSON.stringify({system:'Suggest an SEO headline, one SEO description, and tags for this story. Use only supplied facts.',messages:[{role:'user',content:$('title').value+'\n'+$('body').value.slice(0,6000)}]})});$('msg').textContent=r.text||r.error||''}
function preview(){$('pvTitle').textContent=$('title').value||'Your headline';$('pvSub').textContent=$('sub').value||'';$('pvBody').textContent=$('body').value||'Your article preview will appear here.';$('meta').textContent='THE VOICE REPORTER · '+($('cat').value||'Nigeria')}
init();
</script></body></html>
