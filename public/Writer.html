<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Writer Workspace — THE VOICE REPORTER</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--text:#101828;--muted:#667085;--border:#e4e7ec;--red:#be1212;--green:#087443;--soft:#eef2f7;--shadow:0 14px 40px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.top{background:#0f172a;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.top b{letter-spacing:.05em}.wrap{max-width:1300px;margin:auto;padding:22px 15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:850}.tab.active{background:var(--red);color:#fff;border-color:var(--red)}.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:11px;color:var(--muted);font-weight:850}.field input,.field textarea,.field select{width:100%;padding:10px 11px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;color:#101828;font:inherit}.field textarea{min-height:330px;resize:vertical}.btn{border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 12px;font-weight:850;cursor:pointer}.primary{background:var(--red);color:#fff;border-color:var(--red)}.green{background:var(--green);color:#fff;border-color:var(--green)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.msg{padding:10px 12px;background:var(--soft);border-radius:9px;margin:10px 0;white-space:pre-wrap}.danger{color:#b42318}.muted{color:var(--muted)}.preview{background:#111827;color:#fff;border-radius:14px;padding:22px;min-height:470px}.preview h1{font:900 38px/1.08 Georgia,serif}.preview img,.preview video{max-width:100%;border-radius:12px;margin:12px 0}.story-list{display:grid;gap:11px}.story{border:1px solid var(--border);border-radius:13px;padding:13px}.story h3{margin:0 0 5px}.upload-box{border:1px dashed var(--border);padding:12px;border-radius:12px;background:#fafbfc}.upload-box input{margin-top:8px;max-width:100%}@media(max-width:850px){.grid{grid-template-columns:1fr}.wrap{padding:13px}.preview h1{font-size:30px}}
</style>
</head>
<body>
<header class="top"><b>THE VOICE REPORTER · WRITER WORKSPACE</b><span id="who" class="muted"></span></header>
<main class="wrap"><div class="tabs"><button class="tab active" data-view="dashboard">My Stories</button><button class="tab" data-view="editor">Create Story</button><button class="tab" id="logout">Log out</button></div>
<section id="dashboard" class="panel"><div class="tools"><button class="btn primary" id="new">Create new story</button><button class="btn" id="reload">Reload</button></div><div id="list" class="story-list"></div></section>
<section id="editor" class="panel" style="display:none"><input type="hidden" id="id"><div class="grid"><div><div class="field"><label>Headline</label><input id="title"></div><div class="field"><label>Subheadline</label><input id="sub"></div><div class="grid"><div class="field"><label>Category</label><select id="cat"><option>Nigeria</option><option>Politics</option><option>Business</option><option>Technology</option><option>Sports</option><option>World</option><option>Africa</option><option>Entertainment</option><option>Science</option></select></div><div class="field"><label>Tags</label><input id="tags"></div></div><div class="field"><label>Article body</label><textarea id="body"></textarea></div><div class="grid"><div class="field"><label>Image URL</label><input id="image"></div><div class="upload-box"><b>Upload article image</b><input id="imageFile" type="file" accept="image/*"></div></div><div class="field"><label>Image caption</label><input id="imageCaption"></div><div class="grid"><div class="field"><label>Video URL</label><input id="video"></div><div class="upload-box"><b>Upload article video</b><input id="videoFile" type="file" accept="video/*"></div></div><div class="field"><label>Video caption</label><input id="videoCaption"></div><div class="field"><label>Source / attribution</label><input id="source"></div><div class="tools"><button class="btn" id="aiTitle">AI headline ideas</button><button class="btn" id="aiImprove">AI improve draft</button><button class="btn" id="aiSeo">AI SEO</button></div><div class="tools"><button class="btn" id="save">Save draft</button><button class="btn green" id="submit">Submit for review</button><button class="btn" id="deleteStory">Delete</button></div><div id="msg" class="msg"></div></div><div><div class="preview"><div class="muted" id="meta">THE VOICE REPORTER</div><h1 id="pvTitle">Your headline</h1><div id="pvSub"></div><img id="pvImage" hidden><video id="pvVideo" controls hidden></video><p id="pvBody">Your article preview will appear here.</p></div></div></div></section></main>
<script>
'use strict';let editing=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(u,o={}){const r=await fetch(u,{...o,headers:o.body instanceof FormData?o.headers||{}:{'Content-Type':'application/json',...(o.headers||{})}});const d=await r.json().catch(()=>({ok:false,error:'Invalid response'}));if(r.status===401){location.href='/writer-login';throw new Error('Session expired')}if(!r.ok||d.ok===false)throw new Error(d.error||'Request failed');return d}
async function init(){const m=await api('/api/auth/me');if(!m.authenticated||!['writer','editor'].includes(m.user.role)){location.href='/writer-login';return}$('who').textContent=(m.user.name||m.user.username)+' · '+m.user.role;bind();await loadStories();newStory();}
function bind(){document.querySelectorAll('.tab[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));$('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/writer-login'};$('new').onclick=newStory;$('reload').onclick=loadStories;$('save').onclick=()=>save('draft');$('submit').onclick=()=>save('submitted');$('deleteStory').onclick=deleteStory;$('aiTitle').onclick=aiTitle;$('aiImprove').onclick=aiImprove;$('aiSeo').onclick=aiSeo;['title','sub','body','cat','image','video'].forEach(id=>$(id).addEventListener('input',preview));$('imageFile').onchange=()=>upload('imageFile','image');$('videoFile').onchange=()=>upload('videoFile','video');}
function view(v){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('dashboard').style.display=v==='dashboard'?'block':'none';$('editor').style.display=v==='editor'?'block':'none';}
async function loadStories(){const d=await api('/api/writer/stories');$('list').innerHTML=d.stories.map(s=>`<article class="story"><h3>${esc(s.title)}</h3><div class="muted">${esc(s.category)} · ${esc(s.status)} · ${esc(s.updatedAt||'')}</div><div class="tools"><button class="btn" onclick='editStory(${JSON.stringify(s).replace(/'/g,'&#39;')})'>Edit</button></div></article>`).join('')||'<div class="muted">No stories yet.</div>';}
function newStory(){editing=null;$('id').value='';['title','sub','body','tags','image','imageCaption','video','videoCaption','source'].forEach(x=>$(x).value='');$('cat').value='Nigeria';$('msg').textContent='New story.';preview();view('editor');}
function editStory(s){editing=s;$('id').value=s.id;$('title').value=s.title||'';$('sub').value=s.subheadline||'';$('body').value=s.body||'';$('cat').value=s.category||'Nigeria';$('tags').value=(s.tags||[]).join(', ');$('image').value=s.image||'';$('imageCaption').value=s.imageCaption||'';$('video').value=s.video||'';$('videoCaption').value=s.videoCaption||'';$('source').value=s.sourceAttribution||'';$('msg').textContent='Editing '+s.status;preview();view('editor');}
function data(status){return{title:$('title').value,subheadline:$('sub').value,body:$('body').value,category:$('cat').value,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),image:$('image').value,imageCaption:$('imageCaption').value,video:$('video').value,videoCaption:$('videoCaption').value,sourceAttribution:$('source').value,status}}
async function save(status){if(!$('title').value.trim()||!$('body').value.trim()){return $('msg').textContent='Headline and article body are required.'}try{const r=await api(editing?'/api/writer/stories/'+editing.id:'/api/writer/stories',{method:editing?'PATCH':'POST',body:JSON.stringify(data(status))});editing=r.story;$('id').value=r.story.id;$('msg').textContent='Saved as '+r.story.status+'.';loadStories();}catch(e){$('msg').textContent=e.message}}
async function deleteStory(){if(!editing||!confirm('Delete this story permanently?'))return;await api('/api/writer/stories/'+editing.id,{method:'DELETE'});newStory();loadStories();}
async function upload(input,target){const file=$(input).files[0];if(!file)return;const fd=new FormData();fd.append('file',file);try{const d=await api('/api/upload',{method:'POST',body:fd});$(target).value=d.url;preview();$('msg').textContent='Uploaded '+d.name;}catch(e){$('msg').textContent=e.message}}
async function aiTitle(){const d=await api('/api/ai/chat',{method:'POST',body:JSON.stringify({system:'Create five professional news headlines from supplied facts. Do not invent information.',messages:[{role:'user',content:$('body').value.slice(0,9000)}]})});$('msg').textContent=d.text||d.error||''}
async function aiImprove(){const d=await api('/api/ai/expert',{method:'POST',body:JSON.stringify({system:'Improve the supplied article for newsroom clarity while preserving all facts. Return only the revised article.',messages:[{role:'user',content:$('body').value.slice(0,12000)}]})});if(d.text){$('body').value=d.text;preview();}}
async function aiSeo(){const d=await api('/api/ai/chat',{method:'POST',body:JSON.stringify({system:'Suggest an SEO headline, SEO description and tags for this exact story. Use only supplied facts.',messages:[{role:'user',content:$('title').value+'\n'+$('body').value.slice(0,7000)}]})});$('msg').textContent=d.text||d.error||''}
function preview(){$('pvTitle').textContent=$('title').value||'Your headline';$('pvSub').textContent=$('sub').value||'';$('pvBody').textContent=$('body').value||'Your article preview will appear here.';$('meta').textContent='THE VOICE REPORTER · '+$('cat').value;const i=$('pvImage');if($('image').value){i.src=$('image').value;i.hidden=false}else i.hidden=true;const v=$('pvVideo');if($('video').value){v.src=$('video').value;v.hidden=false}else v.hidden=true;}
init().catch(e=>console.error(e));
</script>
</body></html>
